spring.application.name=HackHub
spring.datasource.url=jdbc:h2:file:./data/hackhub-db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.sql.init.mode=never
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
app.time.mode=fixed
app.time.fixed=2026-02-01T18:00:01